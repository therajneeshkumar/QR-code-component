<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | QR code component</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <main>
    <div class="container">
      <div class="card">
        <div class="image">
          <img src="./images/image-qr-code.png" alt="QR Image">
        </div>
        <div class="card-content">
          <h1>Improve your front-end skills by building projects.</h1>
          <p>Scan the QR code to visit Frontend Mentor and take your coading skills to the next level</p>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://github.com/therajneeshkumar" target="_blank">Rajneesh Kumar</a>.
    </div>
  </footer>
</body>

</html>
